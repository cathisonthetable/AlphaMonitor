name: Compila app iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera progetto Xcode
        run: xcodegen generate

      - name: Compila (senza firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project AlphaMonitor.xcodeproj \
            -scheme AlphaMonitor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/AlphaMonitor.app

      - name: Crea file .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AlphaMonitor.app Payload/
          zip -qr AlphaMonitor.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AlphaMonitor-ipa
          path: AlphaMonitor.ipa

      # Pubblica l'app come Release: link fisso
      # https://github.com/<utente>/AlphaMonitor/releases/latest/download/AlphaMonitor.ipa
      - name: Pubblica Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" AlphaMonitor.ipa \
            --title "Alpha Monitor $TAG" \
            --notes "$MSG" \
            --latest

      - name: Salva log di compilazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
